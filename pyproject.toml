[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airpollution-vis"
version = "0.1.0"
description = "A local visual analytics demo for gridded environmental data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "affine==2.4.0",
    "attrs==26.1.0",
    "certifi==2026.2.25",
    "cftime==1.6.5",
    "click==8.3.2",
    "cligj==0.7.2",
    "h5py==3.16.0",
    "netCDF4==1.7.4",
    "numpy==2.4.4",
    "packaging==26.1",
    "pandas==3.0.2",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "rasterio==1.4.4",
    "scipy==1.17.1",
    "six==1.17.0",
    "xarray==2026.4.0",
]

license = "MIT"

[project.urls]
"Source" = "https://github.com/lelewang1109/GridVis-LLM"

[project.scripts]
gridvis = "gridvis_app.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]
